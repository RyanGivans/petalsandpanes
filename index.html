<!-- ===== PART 1 START: HOMEPAGE ===== -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Petals and Panes is a vintage garden glasshouse photography location in Huntsville, Arkansas, serving Northwest Arkansas."
  />
  <title>Petals & Panes | Vintage Garden Glasshouse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/petalsandpanes/css/base.css" />
  <link rel="stylesheet" href="/petalsandpanes/css/home.css" />
</head>

<body class="home-page">
  <main class="home-stage">
    <img
      class="home-stage__image"
      src="/petalsandpanes/gallery/house-hero-2.png"
      alt="Petals and Panes vintage garden glasshouse at golden hour"
    />

    <div class="home-stage__overlay"></div>
    <div class="home-stage__sunlight"></div>

    <div class="home-stage__signature">
      <p class="home-stage__signature-title">Petals <span>&</span> Panes</p>
      <p class="home-stage__signature-subtitle">Vintage Garden Glasshouse</p>
      <p class="home-stage__signature-location">Huntsville, Arkansas</p>
    </div>

    <a
      class="pane-link pane-link--about"
      href="/petalsandpanes/about/"
      aria-label="Learn about Petals and Panes"
    >
      <span class="pane-link__number">01</span>
      <strong>About</strong>
      <em>The Story</em>
    </a>

    <a
      class="pane-link pane-link--sessions"
      href="/petalsandpanes/sessions/"
      aria-label="Explore photography session options"
    >
      <span class="pane-link__number">02</span>
      <strong>The Space</strong>
      <em>Session Possibilities</em>
    </a>

    <a
      class="pane-link pane-link--gallery"
      href="/petalsandpanes/gallery/"
      aria-label="View the Petals and Panes gallery"
    >
      <span class="pane-link__number">03</span>
      <strong>Gallery</strong>
      <em>See the Glasshouse</em>
    </a>

    <a
      class="pane-link pane-link--booking"
      href="/petalsandpanes/booking/"
      aria-label="Request a booking"
    >
      <span class="pane-link__number">04</span>
      <strong>Book</strong>
      <em>Reserve a Date</em>
    </a>

    <a
      class="pane-link pane-link--contact"
      href="/petalsandpanes/contact/"
      aria-label="Contact Petals and Panes"
    >
      <span class="pane-link__number">05</span>
      <strong>Contact</strong>
      <em>Get in Touch</em>
    </a>

    <button
      class="mobile-menu-button"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-home-menu"
    >
      Explore the Glasshouse
    </button>

    <nav class="mobile-home-menu" id="mobile-home-menu" aria-label="Mobile homepage navigation">
      <a href="/petalsandpanes/about/">About</a>
      <a href="/petalsandpanes/sessions/">The Space</a>
      <a href="/petalsandpanes/gallery/">Gallery</a>
      <a href="/petalsandpanes/booking/">Book</a>
      <a href="/petalsandpanes/contact/">Contact</a>
    </nav>
  </main>

  <script src="/petalsandpanes/app.js"></script>
</body>
</html>
<!-- ===== PART 1 END ===== -->
